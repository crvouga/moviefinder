name: Check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1"
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Let main finish publishing before another run can update the image tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check
      - run: bun run db:validate
      - run: bun run test:local-database
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: moviefinder_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/moviefinder_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:integration
      - run: bun run db:verify
  browser-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
      - run: docker build --platform linux/amd64 -t moviefinder:verification .
      - run: bun scripts/container-smoke.ts moviefinder:verification
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
  # Apply committed Atlas migrations to the production moviefinder schema before the new image
  # is published, so a deployed version never runs against an older schema.
  migrate:
    needs: [fast, integration, browser-and-container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/migrate.yml
  publish:
    needs: [fast, integration, browser-and-container, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: read
    uses: crvouga/workspace/.github/workflows/publish.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: moviefinder
      dockerfile: ./Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/workspace
